[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-provider-routing"
version = "0.1.0"
description = "Pin or exclude a provider for one media workflow capability"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "pydantic>=2.8", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
